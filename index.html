<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Wedding Invitation</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Playfair+Display', serif; text-align: center; margin: 0; background-color: #fdf8f5; color: #5a4b41; }
        .hero { padding: 100px 20px; background: linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)), url('https://images.unsplash.com'); background-size: cover; }
        h1 { font-family: 'Dancing Script', cursive; font-size: 4rem; margin: 0; }
        .details { padding: 50px 20px; line-height: 1.6; }
        .btn { background: #d4a373; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn:hover { background: #bc8a5f; }
        #countdown { font-size: 1.5rem; margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Alex & Taylor</h1>
        <p>Are getting married!</p>
    </div>

    <div class="details">
        <h2>Save the Date</h2>
        <p><strong>Saturday, June 14, 2026</strong></p>
        <p>The Grand Garden, Sunset Valley</p>
        
        <div id="countdown">Loading countdown...</div>

        <p>We can't wait to celebrate with you!</p><br>
        <!-- Replace the '#' with your Google Forms link for RSVPs -->
        <a href="#" class="btn">RSVP Here</a>
    </div>

    <script>
        // Set your wedding date here
        const weddingDate = new Date("June 14, 2026 15:00:00").getTime();
        setInterval(function() {
            const now = new Date().getTime();
            const distance = weddingDate - now;
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("countdown").innerHTML = days + " Days to go!";
        }, 1000);
    </script>
</body>
</html>

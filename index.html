<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorens & Cristine | Wedding Invitation</title>
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .font-script { font-family: 'Alex Brush', cursive; }
        body { font-family: 'Playfair Display', serif; }
        
        @keyframes slow-zoom {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        .animate-slow-zoom {
            animation: slow-zoom 20s infinite alternate ease-in-out;
        }

        @keyframes float-slow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        .animate-float-slow {
            animation: float-slow 8s infinite ease-in-out;
        }

        .fade-in-up {
            transition: all 1s ease-out;
            opacity: 0;
            transform: translateY(30px);
        }
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-[#faf9f6]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [rsvpStatus, setRsvpStatus] = useState('idle');
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            const [formData, setFormData] = useState({ name: '', attending: 'accept', guests: '1', dietary: '' });

            const weddingDate = useMemo(() => new Date('2025-06-21T16:00:00'), []);

            // Countdown Logic
            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const difference = weddingDate.getTime() - now.getTime();
                    if (difference > 0) {
                        setTimeLeft({
                            days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
                            minutes: Math.floor((difference / 1000 / 60) % 60),
                            seconds: Math.floor((difference / 1000) % 60)
                        });
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [weddingDate]);

            // Scroll Animation Logic
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) entry.target.classList.add('visible');
                    });
                }, { threshold: 0.1 });

                document.querySelectorAll('.fade-in-up').forEach(el => observer.observe(el));
            }, []);

            const handleRSVP = (e) => {
                e.preventDefault();
                setRsvpStatus('loading');
                setTimeout(() => setRsvpStatus('success'), 1500);
            };

            return (
                <div className="text-[#333] overflow-x-hidden selection:bg-[#c5a059]/30">
                    {/* Hero Section */}
                    <section className="relative h-screen flex items-center justify-center text-center px-4 overflow-hidden">
                        <div 
                            className="absolute inset-0 z-0 animate-slow-zoom"
                            style={{
                                backgroundImage: `url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80')`,
                                backgroundSize: 'cover',
                                backgroundPosition: 'center',
                            }}
                        />
                        <div className="absolute inset-0 bg-black/40 z-10" />
                        
                        <div className="relative z-20 text-white max-w-4xl">
                            <p className="tracking-[0.4em] uppercase text-xs md:text-sm mb-6 opacity-90">The Wedding Celebration of</p>
                            <h1 className="text-5xl sm:text-7xl md:text-9xl font-light mb-4 drop-shadow-lg">
                                Lorens <span className="block md:inline text-3xl md:text-6xl font-script">&</span> Cristine
                            </h1>
                            <div className="h-px w-16 bg-white/60 mx-auto my-8 md:my-10" />
                            <p className="text-lg md:text-2xl font-light tracking-widest uppercase mb-12">June 21, 2025 • Napa Valley</p>
                            
                            <div className="flex justify-center gap-4 md:gap-8 mb-12">
                                {['Days', 'Hrs', 'Min', 'Sec'].map((label, i) => (
                                    <div key={i} className="flex flex-col items-center">
                                        <span className="text-2xl md:text-4xl font-light">
                                            {String(Object.values(timeLeft)[i]).padStart(2, '0')}
                                        </span>
                                        <span className="text-[10px] uppercase tracking-widest opacity-70">{label}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="absolute bottom-8 left-1/2 -translate-x-1/2 z-20 text-white/70 animate-bounce">
                            <i data-lucide="chevron-down" size="32"></i>
                        </div>
                    </section>

                    {/* Story Section */}
                    <section className="fade-in-up py-20 px-6 max-w-4xl mx-auto text-center">
                        <div className="flex justify-center text-[#c5a059] mb-6"><i data-lucide="sparkles" size="28"></i></div>
                        <h2 className="text-3xl md:text-4xl mb-8 font-light">Our Story</h2>
                        <div className="grid md:grid-cols-2 gap-12 items-center">
                            <div className="rounded-2xl overflow-hidden shadow-xl aspect-[4/5]">
                                <img src="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?auto=format&fit=crop&q=80" className="w-full h-full object-cover" />
                            </div>
                            <div className="text-left space-y-4 text-gray-600 leading-relaxed">
                                <p>From a chance meeting at a local bookstore to a sunset proposal in the hills, our journey has been filled with laughter and adventure.</p>
                                <p>Lorens fell for Cristine's infectious laugh, and Cristine found a home in Lorens' kindness. We can't wait to celebrate with you.</p>
                            </div>
                        </div>
                    </section>

                    {/* Details */}
                    <section className="py-20 bg-white">
                        <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div className="fade-in-up flex flex-col items-center p-10 bg-[#faf9f6] rounded-3xl">
                                <div className="text-[#c5a059] mb-6"><i data-lucide="calendar" size="32"></i></div>
                                <h3 className="uppercase tracking-widest text-sm font-bold mb-2">When</h3>
                                <p>Saturday, June 21, 2025</p>
                                <p className="text-gray-500 italic">4:00 PM Ceremony</p>
                            </div>
                            <div className="fade-in-up flex flex-col items-center p-10 bg-[#faf9f6] rounded-3xl" style={{transitionDelay: '100ms'}}>
                                <div className="text-[#c5a059] mb-6"><i data-lucide="map-pin" size="32"></i></div>
                                <h3 className="uppercase tracking-widest text-sm font-bold mb-2">Where</h3>
                                <p>The Grand Oak Estate</p>
                                <p className="text-gray-500 italic">Napa Valley, CA</p>
                            </div>
                            <div className="fade-in-up flex flex-col items-center p-10 bg-[#faf9f6] rounded-3xl" style={{transitionDelay: '200ms'}}>
                                <div className="text-[#c5a059] mb-6"><i data-lucide="camera" size="32"></i></div>
                                <h3 className="uppercase tracking-widest text-sm font-bold mb-2">Attire</h3>
                                <p>Black Tie Optional</p>
                                <p className="text-gray-500 italic">Summer garden elegance</p>
                            </div>
                        </div>
                    </section>

                    {/* RSVP */}
                    <section className="py-24 bg-[#f3f1ec]">
                        <div className="fade-in-up max-w-2xl mx-auto px-4">
                            <div className="bg-white p-8 md:p-16 rounded-[2rem] shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-[#c5a059]" />
                                <div className="text-center mb-12">
                                    <h2 className="text-4xl font-light mb-4">RSVP</h2>
                                    <p className="text-gray-500 italic">Please respond by May 21st, 2025</p>
                                </div>

                                {rsvpStatus === 'success' ? (
                                    <div className="text-center py-8">
                                        <div className="text-green-500 mb-4"><i data-lucide="check-circle-2" size="48"></i></div>
                                        <h3 className="text-2xl mb-2">See you there!</h3>
                                        <p className="text-gray-600">Your response has been saved.</p>
                                    </div>
                                ) : (
                                    <form onSubmit={handleRSVP} className="space-y-8">
                                        <input 
                                            required
                                            className="w-full bg-transparent border-b-2 border-gray-100 py-3 focus:border-[#c5a059] outline-none transition-all"
                                            placeholder="Your Full Name"
                                            value={formData.name}
                                            onChange={(e) => setFormData({...formData, name: e.target.value})}
                                        />
                                        <select 
                                            className="w-full bg-transparent border-b-2 border-gray-100 py-3 focus:border-[#c5a059] outline-none"
                                            value={formData.attending}
                                            onChange={(e) => setFormData({...formData, attending: e.target.value})}
                                        >
                                            <option value="accept">Happily Accepts</option>
                                            <option value="decline">Regretfully Declines</option>
                                        </select>
                                        <button className="w-full bg-[#4a4a4a] text-white py-5 rounded-full hover:bg-[#333] transition-all uppercase tracking-widest text-xs font-bold shadow-xl">
                                            {rsvpStatus === 'loading' ? 'Sending...' : 'Confirm Attendance'}
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    </section>

                    <footer className="py-16 bg-white text-center">
                        <h2 className="text-3xl font-script mb-4">Lorens & Cristine</h2>
                        <p className="text-[10px] text-gray-300 uppercase tracking-widest">#LorensAndCristine2025</p>
                    </footer>

                    {/* Floating Leaves */}
                    <div className="fixed inset-0 pointer-events-none z-0 opacity-[0.1]">
                        {[...Array(6)].map((_, i) => (
                            <div 
                                key={i}
                                className="absolute animate-float-slow text-[#c5a059]"
                                style={{
                                    left: `${(i * 18) % 100}%`,
                                    top: `${(i * 25) % 100}%`,
                                    animationDelay: `${i * 1.2}s`,
                                    fontSize: '24px'
                                }}
                            >
                                🌿
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Initialize Icons after React Render
        setTimeout(() => { lucide.createIcons(); }, 100);
    </script>
</body>
</html>

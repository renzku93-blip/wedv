<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorens & Cristine | Enchanted Wedding</title>
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,400&family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
    <style>
        .font-script { font-family: 'Alex Brush', cursive; }
        .font-serif-luxe { font-family: 'Cormorant Garamond', serif; }
        body { font-family: 'Montserrat', sans-serif; background-color: #fdfdfb; color: #2d3436; }
        
        .bg-emerald-luxe { background-color: #1b3022; }
        .text-emerald-luxe { color: #1b3022; }
        .border-emerald-luxe { border-color: #1b3022; }

        @keyframes slow-zoom {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        .animate-slow-zoom {
            animation: slow-zoom 20s infinite alternate ease-in-out;
        }

        @keyframes heart-fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(100vh) translateX(100px) rotate(360deg); opacity: 0; }
        }
        .heart-particle {
            position: fixed;
            top: -10%;
            pointer-events: none;
            z-index: 50;
            animation: heart-fall linear infinite;
        }

        @keyframes subtle-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.02); }
        }
        .animate-float {
            animation: subtle-float 10s infinite ease-in-out;
        }

        .fade-in-up {
            transition: all 1.4s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            transform: translateY(20px);
        }
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes music-pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        .animate-music {
            animation: music-pulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const [rsvpStatus, setRsvpStatus] = useState('idle');
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            const [formData, setFormData] = useState({ name: '', attending: 'accept', guests: '1' });
            const [isPlaying, setIsPlaying] = useState(false);
            const audioRef = useRef(null);

            const weddingDate = useMemo(() => new Date('2027-06-21T16:00:00'), []);

            const hearts = useMemo(() => {
                return [...Array(12)].map((_, i) => ({
                    id: i,
                    left: `${Math.random() * 100}%`,
                    duration: `${12 + Math.random() * 18}s`,
                    delay: `${Math.random() * 10}s`,
                    size: `${20 + Math.random() * 25}px`,
                }));
            }, []);

            useEffect(() => {
                const calculateTimeLeft = () => {
                    const now = new Date();
                    const difference = weddingDate.getTime() - now.getTime();
                    
                    if (difference > 0) {
                        setTimeLeft({
                            days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
                            minutes: Math.floor((difference / 1000 / 60) % 60),
                            seconds: Math.floor((difference / 1000) % 60)
                        });
                    } else {
                        setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0 });
                    }
                };

                // Run once immediately
                calculateTimeLeft();
                
                // Set interval to update every second
                const timer = setInterval(calculateTimeLeft, 1000);
                return () => clearInterval(timer);
            }, [weddingDate]);

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) entry.target.classList.add('visible');
                    });
                }, { threshold: 0.1 });

                document.querySelectorAll('.fade-in-up').forEach(el => observer.observe(el));
            }, []);

            const toggleMusic = () => {
                if (audioRef.current) {
                    if (isPlaying) {
                        audioRef.current.pause();
                        setIsPlaying(false);
                    } else {
                        audioRef.current.play().catch(e => console.error("Playback failed", e));
                        setIsPlaying(true);
                    }
                }
            };

            useEffect(() => {
                const handleFirstInteraction = () => {
                    if (audioRef.current && !isPlaying) {
                        audioRef.current.play()
                            .then(() => setIsPlaying(true))
                            .catch(e => console.log("User interaction required for audio"));
                    }
                    window.removeEventListener('scroll', handleFirstInteraction);
                    window.removeEventListener('click', handleFirstInteraction);
                };

                window.addEventListener('scroll', handleFirstInteraction);
                window.addEventListener('click', handleFirstInteraction);
                return () => {
                    window.removeEventListener('scroll', handleFirstInteraction);
                    window.removeEventListener('click', handleFirstInteraction);
                };
            }, [isPlaying]);

            const handleRSVP = (e) => {
                e.preventDefault();
                setRsvpStatus('loading');
                setTimeout(() => setRsvpStatus('success'), 1500);
            };

            return (
                <div className="overflow-x-hidden selection:bg-[#1b3022]/10">
                    <audio 
                        ref={audioRef}
                        loop
                        src="music.mp3"
                    />

                    <button 
                        onClick={toggleMusic}
                        className="fixed bottom-6 right-6 z-[100] bg-white/90 backdrop-blur-md p-4 rounded-full shadow-xl border border-emerald-luxe/10 text-emerald-luxe transition-all hover:scale-110 active:scale-95"
                    >
                        {!isPlaying ? (
                            <Icon name="volume-x" />
                        ) : (
                            <div className="animate-music">
                                <Icon name="music" />
                            </div>
                        )}
                    </button>

                    {hearts.map(h => (
                        <div 
                            key={h.id}
                            className="heart-particle"
                            style={{ 
                                left: h.left, 
                                animationDuration: h.duration, 
                                animationDelay: h.delay,
                                width: h.size,
                                height: h.size
                            }}
                        >
                            <svg viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="1" className="w-full h-full opacity-30">
                                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
                            </svg>
                        </div>
                    ))}

                    <section className="relative h-screen flex items-center justify-center text-center px-4 overflow-hidden">
                        <div 
                            className="absolute inset-0 z-0 animate-slow-zoom"
                            style={{
                                backgroundImage: `url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80')`,
                                backgroundSize: 'cover',
                                backgroundPosition: 'center',
                            }}
                        />
                        <div className="absolute inset-0 bg-black/30 z-10" />
                        
                        <div className="relative z-20 max-w-5xl text-white">
                            <span className="inline-block tracking-[0.5em] uppercase text-[10px] md:text-xs mb-8 opacity-80 font-medium">The Celebration of a Lifetime</span>
                            <h1 className="text-6xl sm:text-8xl md:text-9xl font-serif-luxe font-light mb-4 drop-shadow-2xl">
                                Lorens <span className="text-4xl md:text-7xl font-script block md:inline my-2 text-white/90">&</span> Cristine
                            </h1>
                            <div className="h-px w-24 bg-white/40 mx-auto my-10" />
                            <p className="text-lg md:text-2xl tracking-[0.3em] uppercase font-light font-serif-luxe italic mb-12">June 21, 2027 • Napa Valley</p>
                            
                            <div className="flex justify-center gap-6 md:gap-12">
                                {['Days', 'Hrs', 'Min', 'Sec'].map((label, i) => (
                                    <div key={i} className="flex flex-col items-center">
                                        <span className="text-3xl md:text-5xl font-serif-luxe border-b border-white/20 pb-2 mb-2">
                                            {String(Object.values(timeLeft)[i]).padStart(2, '0')}
                                        </span>
                                        <span className="text-[9px] uppercase tracking-widest opacity-60 font-bold">{label}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="absolute bottom-10 left-1/2 -translate-x-1/2 z-20 text-white/50 animate-bounce">
                            <Icon name="chevron-down" size={32} />
                        </div>
                    </section>

                    <section className="fade-in-up py-24 px-6 text-center bg-white">
                        <div className="animate-float inline-block text-emerald-luxe/30 mb-8">
                            <Icon name="heart" size={48} />
                        </div>
                        <h2 className="text-3xl md:text-5xl font-serif-luxe italic font-light max-w-3xl mx-auto leading-relaxed text-emerald-luxe">
                            "Where there is love, there is life. We invite you to join us as we step into our new beginning."
                        </h2>
                    </section>

                    <section className="py-24 bg-[#f4f6f2] relative overflow-hidden">
                        <div className="max-w-6xl mx-auto px-4 grid md:grid-cols-3 gap-8 relative z-10">
                            {[
                                { icon: 'calendar-days', title: 'The Date', p1: 'June 21, 2027', p2: '4:00 PM Reception' },
                                { icon: 'map', title: 'The Place', p1: 'Grand Oak Estate', p2: 'Napa Valley, CA' },
                                { icon: 'sparkles', title: 'The Style', p1: 'Formal Garden', p2: 'Sage & Emerald Tones' }
                            ].map((item, i) => (
                                <div key={i} className="fade-in-up bg-white p-12 rounded-3xl shadow-sm border border-emerald-luxe/5 text-center transition-all hover:shadow-md">
                                    <div className="text-emerald-luxe/40 mb-8 flex justify-center">
                                        <Icon name={item.icon} size={32} />
                                    </div>
                                    <h4 className="font-serif-luxe text-2xl mb-4 tracking-wide text-emerald-luxe">{item.title}</h4>
                                    <p className="text-gray-700 font-medium mb-1">{item.p1}</p>
                                    <p className="text-gray-400 text-sm italic">{item.p2}</p>
                                </div>
                            ))}
                        </div>
                    </section>

                    <section className="py-24 px-4 bg-white">
                        <div className="max-w-6xl mx-auto grid md:grid-cols-2 gap-20 items-center">
                            <div className="fade-in-up relative group">
                                <div className="absolute -inset-4 border border-emerald-luxe/10 rounded-full" />
                                <img 
                                    src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&q=80" 
                                    className="rounded-full aspect-square object-cover shadow-2xl relative z-10" 
                                />
                            </div>
                            <div className="fade-in-up space-y-8">
                                <Icon name="stars" className="text-emerald-luxe/20" size={32} />
                                <h3 className="text-5xl font-serif-luxe font-light text-emerald-luxe">Our Forever Story</h3>
                                <p className="text-gray-600 leading-loose text-lg font-light">
                                    What started as a shared passion for adventure grew into a lifetime of partnership. Lorens and Cristine found in each other a home that moves with them, wherever the road may lead.
                                </p>
                                <div className="h-px w-16 bg-emerald-luxe/20" />
                                <p className="text-gray-500 italic font-serif-luxe text-xl">"I have found the one whom my soul loves."</p>
                            </div>
                        </div>
                    </section>

                    <section className="py-32 bg-[#fdfdfb] relative overflow-hidden">
                        <div className="fade-in-up max-w-2xl mx-auto px-6 relative z-10">
                            <div className="bg-white/70 backdrop-blur-md p-10 md:p-16 rounded-[3rem] border border-emerald-luxe/10 shadow-xl text-center">
                                <h2 className="text-5xl font-serif-luxe font-light mb-4 text-emerald-luxe">RSVP</h2>
                                <p className="text-emerald-luxe/50 mb-12 italic font-serif-luxe text-lg">Kindly respond by May 06, 2027</p>

                                {rsvpStatus === 'success' ? (
                                    <div className="py-12 bg-emerald-luxe/5 rounded-3xl border border-emerald-luxe/10">
                                        <Icon name="check" className="mx-auto mb-6 text-emerald-luxe/60" size={48} />
                                        <p className="text-2xl font-serif-luxe text-emerald-luxe">We look forward to celebrating with you!</p>
                                    </div>
                                ) : (
                                    <form onSubmit={handleRSVP} className="space-y-10 text-left">
                                        <div>
                                            <label className="text-[10px] uppercase tracking-widest text-emerald-luxe/40 font-bold mb-3 block">Full Name</label>
                                            <input 
                                                required
                                                className="w-full bg-transparent border-b border-emerald-luxe/20 py-4 focus:border-emerald-luxe outline-none transition-all text-2xl font-serif-luxe italic text-emerald-luxe"
                                                placeholder="Guest Name"
                                                value={formData.name}
                                                onChange={(e) => setFormData({...formData, name: e.target.value})}
                                            />
                                        </div>
                                        
                                        <div className="grid md:grid-cols-2 gap-12">
                                            <div>
                                                <label className="text-[10px] uppercase tracking-widest text-emerald-luxe/40 font-bold mb-3 block">Attendance</label>
                                                <select 
                                                    className="w-full bg-transparent border-b border-emerald-luxe/20 py-4 focus:border-emerald-luxe outline-none appearance-none font-serif-luxe text-lg text-emerald-luxe"
                                                    value={formData.attending}
                                                    onChange={(e) => setFormData({...formData, attending: e.target.value})}
                                                >
                                                    <option value="accept">Happily Accepts</option>
                                                    <option value="decline">Regretfully Declines</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-[10px] uppercase tracking-widest text-emerald-luxe/40 font-bold mb-3 block">Guests</label>
                                                <select 
                                                    className="w-full bg-transparent border-b border-emerald-luxe/20 py-4 focus:border-emerald-luxe outline-none appearance-none font-serif-luxe text-lg text-emerald-luxe"
                                                    value={formData.guests}
                                                    onChange={(e) => setFormData({...formData, guests: e.target.value})}
                                                >
                                                    {[1, 2, 3, 4].map(n => <option key={n} value={n}>{n}</option>)}
                                                </select>
                                            </div>
                                        </div>

                                        <button className="w-full bg-emerald-luxe text-white py-6 rounded-full hover:shadow-lg transition-all uppercase tracking-[0.4em] text-[10px] font-black mt-12">
                                            {rsvpStatus === 'loading' ? 'Sending...' : 'Confirm My Attendance'}
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    </section>

                    <footer className="py-24 text-center bg-white">
                        <div className="flex justify-center gap-4 mb-8 text-emerald-luxe/10">
                            <Icon name="heart" />
                            <Icon name="heart" />
                            <Icon name="heart" />
                        </div>
                        <h2 className="text-5xl font-script text-emerald-luxe mb-4">Lorens & Cristine</h2>
                        <p className="text-[10px] text-gray-400 uppercase tracking-[0.6em] font-medium">Napa Valley • 2027</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
